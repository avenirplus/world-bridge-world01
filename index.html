<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD BRIDGE — WORLD 01</title>
<style>
:root{--deep:#102A43;--ocean:#167D9A;--sky:#DDF3F5;--sand:#F4E9D5;--coral:#FF7A66;--ink:#17212B;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#eef5f5;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 30px #102a4315}.top{padding:15px 18px 10px;position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(10px);z-index:5}.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--deep)}.back{border:0;background:var(--sky);border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--deep)}.progress{height:6px;background:#e5eeee;border-radius:8px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ocean);transition:width .25s}.screen{padding:0 18px 28px;min-height:calc(100vh - 82px);display:flex;flex-direction:column}.visual{height:auto;min-height:0;max-height:none;margin:0 -18px 20px;background:#f4f8f8;overflow:visible;display:flex;justify-content:center}.visual img{width:100%;height:auto;max-height:none;display:block;object-fit:contain}.card{background:#fff;border-radius:25px;padding:2px 4px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ocean);font-weight:800;margin:8px 0}.title{font-size:clamp(27px,7vw,38px);line-height:1.12;margin:0 0 11px;color:var(--deep)}.jp{font-size:15px;line-height:1.75;margin:0 0 15px;color:#53636b}.english{font-size:22px;line-height:1.35;font-weight:800;color:var(--deep);background:#e5f6f7;border-radius:18px;padding:18px;margin:12px 0}.reading{font-size:17px;line-height:1.8;font-weight:500;text-align:left;background:#f3f9f9}.reading p{margin:0 0 15px}.reading p:last-child{margin-bottom:0}.qcard{background:#f7fbfb;border:1px solid #dceaea;border-radius:17px;padding:14px;margin:11px 0}.qtext{font-weight:800;color:var(--deep);line-height:1.45;margin-bottom:9px}.summarybox{width:100%;min-height:150px;border:2px solid #d6e7e8;border-radius:16px;padding:14px;font:inherit;font-size:16px;line-height:1.6;resize:vertical}.wordcount{font-size:13px;font-weight:800;margin:6px 2px 12px;color:#64757d}.model{background:#fff8ee;border:1px solid #f1dfc6;border-radius:15px;padding:12px;margin-top:12px}.helper{background:#fff8ee;border:1px solid #f1dfc6;border-radius:15px;padding:11px 13px;margin:13px 0;font-size:14px;color:#56636a}.helper summary{cursor:pointer;color:#916b42;font-weight:700}.listen{width:100%;border:0;background:#d9f3f5;color:#05617a;border-radius:20px;padding:13px;font-size:16px;font-weight:800;margin:7px 0 12px}.choices{display:grid;gap:9px;margin:10px 0 15px}.choice{border:2px solid #e6eeee;background:#f7fbfb;color:var(--deep);border-radius:16px;padding:13px 12px;font-size:16px;font-weight:700;cursor:pointer}.choice.selected{border-color:var(--ocean);background:#dff5f6}.choice.correct{border-color:#72b99f;background:#e5f6ee}.choice.wrong{border-color:#f2c4a8;background:#fff1ea}.bottom{margin-top:auto;display:flex;gap:9px}.nav{flex:1;border:0;border-radius:18px;padding:15px;background:var(--ocean);color:#fff;font-size:17px;font-weight:800;cursor:pointer}.nav.secondary{background:var(--sky);color:var(--deep)}.nav:disabled{opacity:.45}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tag{background:var(--sky);color:var(--deep);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}.input{width:100%;border:2px solid #d6e7e8;border-radius:15px;padding:13px;font-size:16px;margin:5px 0 12px;color:var(--ink);background:#fbfefe}.small{font-size:12px;color:#6a7b82;font-weight:700}.complete{background:linear-gradient(#fff,#effafa);text-align:center}.complete .visual{height:auto}.complete .title{font-size:32px}.center{align-items:center;justify-content:center;text-align:center}.logo{letter-spacing:.25em;font-size:14px;font-weight:900;color:var(--ocean)}
</style></head><body><main class="app" id="app"></main>
<script>
const A='';
const screens=[
 {label:'Entry',img:'hero.png',ey:'WORLD 01',title:'Where Does<br>Our Plastic Go?',jp:'すてたプラスチックは、どこへ行く？',listen:'Where does our plastic go?',help:'今日は、とてもいい天気。',start:true},
 {label:'Discover',img:'hero.png',ey:'DISCOVER',title:'Something is flying...<br>Look!',jp:'何かが飛んでいます。見てみよう。',listen:'Something is flying. Look!',help:'見て！'},
 {label:'Prediction',img:'hero.png',ey:'WHAT DO YOU THINK?',title:'Where will it go?',jp:'どこへ行くと思う？',choices:['川へ','海へ','どこかで消える']},
 {label:'Story — River',img:'story.png',ey:'FOLLOW THE PLASTIC',title:'Some plastic goes<br>into rivers.',jp:'プラスチックごみの中には、川に入ってしまうものもあります。',listen:'Some plastic goes into rivers.',help:'川に入ってしまうものもあります。'},
 {label:'Story — Ocean',img:'story.png',ey:'FOLLOW THE WATER',title:'Rivers carry it<br>to the ocean.',jp:'川はそれを海まで運んでいきます。',listen:'Rivers carry it to the ocean.',help:'川はごみを海まで運びます。'},
 {label:'Story — Animals',img:'environment.png',ey:'WHY?',title:'This can be a problem<br>for animals.',jp:'これは動物たちにとって問題です。',choices:['食べ物だと思うかもしれない','眠くなるから','わからない']},
 {label:'plastic waste',img:'story.png',ey:'NEW IDEA',title:'plastic waste',jp:'使い終わって捨てられたプラスチックなどのこと。',english:'plastic + waste',listen:'plastic waste'},
 {label:'environment',img:'environment.png',ey:'LOOK AT THE WHOLE WORLD',title:'environment',jp:'人や動物、植物、水、空気、町など、私たちを取りまく世界。',choices:['海だけ','森だけ','みんなを取りまく世界全部']},
 {label:'Same Idea. New English.',ey:'SAME IDEA. NEW ENGLISH.',title:'Same idea.<br>New English.',jp:'同じ意味でも、英語がレベルアップします。',english:'People use a lot of plastic.<br>↓<br>People produce a lot of plastic waste.',listen:'People produce a lot of plastic waste.'},
 {label:'government',img:'government.png',ey:'WHO CAN HELP?',title:'government',jp:'みんなが暮らす社会のために、ルールを作ったり公共の仕事をしたりするしくみ。',tags:['roads','schools','parks','waste collection','public transport','rules']},
 {label:'Target Reading',img:'environment.png',ey:'TARGET READING',title:'Read the full passage.',jp:'約200語。英検2級レベルのまとまった英文を読もう。',long:true,english:'<p>Plastic waste is a serious problem in many cities around the world. People use plastic bags, bottles, and food containers every day because they are light, cheap, and convenient. However, some of these items are used only once and then thrown away. When plastic is not collected properly, it can enter rivers and eventually reach the ocean. Sea animals may mistake small pieces of plastic for food, and this can harm them.</p><p>Many governments are trying to reduce this problem. Some cities charge people for plastic bags, while others ask stores to use paper or reusable materials. Governments can also improve waste collection systems and teach people how to recycle correctly. These actions can reduce the amount of plastic that reaches the environment. However, rules alone are not enough. Businesses and individuals also have an important role.</p><p>For example, companies can design products that use less plastic, and customers can choose reusable bottles or shopping bags. People can also pick up litter in their neighborhoods and separate waste at home. Each action may seem small, but millions of small choices can make a large difference. To protect rivers, oceans, and animals, governments, businesses, and citizens need to work together.</p>',listen:'fixed-long'},
 {label:'Reading Check',img:'environment.png',ey:'READING CHECK',title:'Can you follow the whole passage?',jp:'本文全体から答える。1文だけを見て解く問題ではありません。',checks:[{q:'1. Why can plastic become a problem for sea animals?',choices:['They may mistake it for food.','It makes rivers colder.','It stops people from recycling.'],correct:0},{q:'2. Why are government rules alone not enough?',choices:['Plastic is always too expensive.','Businesses and individuals also need to act.','Governments cannot collect waste.'],correct:1},{q:'3. Which action is NOT mentioned in the passage?',choices:['Using reusable bags','Separating waste at home','Building more airports'],correct:2}]},
 {label:'Your Idea',img:'hero.png',ey:'YOUR IDEA',title:'What can we do<br>to reduce plastic waste?',jp:'自分の考えを英文にしてみよう。',input:true},
 {label:'Summary',img:'environment.png',ey:'EIKEN GRADE 2 SUMMARY',title:'Summarize the passage<br>in 45–55 words.',jp:'英検2級の要約形式。本文の「問題→対策→みんなの役割」をまとめよう。',summaryTask:true},
 {label:'WORLD 01 COMPLETE',img:'complete.png',ey:'WORLD 01 COMPLETE',title:'You can read<br>this world now.',jp:'知らなかった世界が、英語で読める世界になった。',tags:['plastic waste','environment','reduce','protect','government'],complete:true}
];
let page=0,chosen=null,player=null; const app=document.getElementById('app');

const audioMap={
  0:'audio/01-entry.mp3',
  1:'audio/02-discover.mp3',
  3:'audio/04-river.mp3',
  4:'audio/05-ocean.mp3',
  6:'audio/07-plastic-waste.mp3',
  8:'audio/09-new-english.mp3',
  10:'audio/11-target-reading-long.mp3',
  13:'audio/14-summary.mp3'
};
const helpAudioMap={
  0:'audio/01-help-ja.mp3',
  1:'audio/02-help-ja.mp3',
  3:'audio/04-help-ja.mp3',
  4:'audio/05-help-ja.mp3'
};
const ideaTextMap={
  'use fewer plastic bags':'I think we should use fewer plastic bags because they can reduce plastic waste.',
  'use a reusable bottle':'I think we should use a reusable bottle because it can reduce plastic waste.',
  'pick up litter':'I think we should pick up litter because it can protect the environment.'
};
const ideaAudioMap={
  'use fewer plastic bags':'audio/13-fewer-bags.mp3',
  'use a reusable bottle':'audio/13-reusable-bottle.mp3',
  'pick up litter':'audio/13-pick-up-litter.mp3'
};

function stop(){
  if(player){
    player.pause();
    player.currentTime=0;
  }
  player=null;
}
function playAudio(src){
  if(!src)return;
  stop();
  player=new Audio(src);
  player.preload='auto';
  player.play().catch(()=>alert('音声を再生できませんでした。もう一度ボタンを押してください。'));
}
function playCurrent(){playAudio(audioMap[page])}
function playHelp(){playAudio(helpAudioMap[page])}
function updateIdea(){
  const act=document.getElementById('act');
  const idea=document.getElementById('idea');
  if(!act||!idea)return;
  idea.textContent=ideaTextMap[act.value]||'';
}
function playIdea(){
  const act=document.getElementById('act');
  if(!act)return;
  playAudio(ideaAudioMap[act.value]);
}
function render(){stop();chosen=null;const s=screens[page], pct=(page+1)/15*100;app.innerHTML=`<header class="top"><div class="topline"><button class="back" onclick="go(-1)" ${page===0?'disabled':''}>‹</button><span>WORLD BRIDGE</span><span>${page+1}/15</span></div><div class="progress"><i style="width:${pct}%"></i></div></header><section class="screen ${s.complete?'complete':''} ${page===0?'center':''}">${s.img?`<div class="visual"><img src="${s.img}" alt=""></div>`:''}<div class="card"><div class="eyebrow">${s.ey}</div><h1 class="title">${s.title}</h1>${s.jp?`<p class="jp">${s.jp}</p>`:''}${s.english?`<div class="english ${s.long?'reading':''}">${s.english}</div>`:''}${s.tags?`<div class="tags">${s.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}${s.choices?`<div class="choices">${s.choices.map((x,i)=>`<button class="choice" data-i="${i}" onclick="choose(this,${i})">${x}</button>`).join('')}</div>`:''}${s.checks?s.checks.map((q,qi)=>`<div class="qcard"><div class="qtext">${q.q}</div><div class="choices">${q.choices.map((x,i)=>`<button class="choice" onclick="chooseCheck(this,${qi},${i},${q.correct})">${x}</button>`).join('')}</div></div>`).join(''):''}${s.summaryTask?`<textarea id="summaryInput" class="summarybox" placeholder="Write 45–55 words here..." oninput="countWords()"></textarea><div class="wordcount" id="wordcount">0 words</div><details class="model"><summary>モデル要約を見る</summary><p>Plastic waste can travel through rivers to the ocean and harm sea animals. Governments are reducing the problem through rules, better waste collection, and recycling education. However, businesses and individuals must also act by using less plastic, choosing reusable items, picking up litter, and separating waste.</p></details>`:''}${s.input?`<div class="small">STEP 1　行動を選ぶ</div><select class="input" id="act" onchange="updateIdea()"><option>use fewer plastic bags</option><option>use a reusable bottle</option><option>pick up litter</option></select><div class="small">STEP 2　英文を作る</div><div class="english" id="idea">I think we should use fewer plastic bags because they can reduce plastic waste.</div><button class="listen" onclick="playIdea()">🔊 Listen</button>`:''}${s.listen?`<button class="listen" onclick="playCurrent()">🔊 Listen</button>`:''}${s.help?`<details class="helper"><summary>▱ 日本語HELP</summary><div>${s.help}</div><button class="listen" onclick="playHelp()">🔊 日本語を聞く</button></details>`:''}</div><div class="bottom">${page>0?'<button class="nav secondary" onclick="go(-1)">戻る</button>':''}${page===0?'<button class="nav" onclick="go(1)">はじめる →</button>':page===14?'<button class="nav" onclick="page=0;render()">もう一度見る</button>':'<button class="nav" onclick="go(1)">次へ →</button>'}</div></section>`}
function chooseCheck(el,qi,i,correct){const box=el.closest('.qcard');box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong','selected'));el.classList.add(i===correct?'correct':'wrong')}
function countWords(){const el=document.getElementById('summaryInput'),out=document.getElementById('wordcount');if(!el||!out)return;const n=el.value.trim()?el.value.trim().split(/\s+/).length:0;out.textContent=n+' words'+(n>=45&&n<=55?' ✓':'')}
function choose(el,i){chosen=i;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected','correct','wrong'));el.classList.add('selected');const correct={2:0,5:0,7:2,11:0,13:0}[page]; if(correct===i)el.classList.add('correct'); else if(correct!==undefined)el.classList.add('wrong')}
function go(n){page=Math.max(0,Math.min(14,page+n));render();window.scrollTo(0,0)}
render();
</script></body></html>
