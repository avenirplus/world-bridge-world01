name: Build image assets

on:
  push:
    paths:
      - '.parts/READY'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild optimized image assets
        shell: bash
        run: |
          set -euo pipefail
          for name in hero story environment government complete; do
            cat ".parts/${name}."*.b64 | tr -d '\n' | base64 -d > "${name}.jpg"
          done
          rm -f .parts/*.b64
      - name: Commit image assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero.jpg story.jpg environment.jpg government.jpg complete.jpg .parts
          git diff --cached --quiet || git commit -m "Add WORLD BRIDGE image assets"
          git push
