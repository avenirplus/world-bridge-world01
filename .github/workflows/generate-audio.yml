name: Generate fixed lesson audio

on:
  push:
    paths:
      - ".github/workflows/generate-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TTS
        run: pip install edge-tts
      - name: Generate fixed MP3 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio

          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Where does our plastic go?" --write-media audio/01-entry.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Something is flying. Look!" --write-media audio/02-discover.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Some plastic goes into rivers." --write-media audio/04-river.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Rivers carry it to the ocean." --write-media audio/05-ocean.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "plastic waste" --write-media audio/07-plastic-waste.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "People produce a lot of plastic waste." --write-media audio/09-new-english.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Plastic waste can cause problems for sea animals." --write-media audio/11-target-reading.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Plastic waste is a serious problem in many cities around the world. People use plastic bags, bottles, and food containers every day because they are light, cheap, and convenient. However, some of these items are used only once and then thrown away. When plastic is not collected properly, it can enter rivers and eventually reach the ocean. Sea animals may mistake small pieces of plastic for food, and this can harm them. Many governments are trying to reduce this problem. Some cities charge people for plastic bags, while others ask stores to use paper or reusable materials. Governments can also improve waste collection systems and teach people how to recycle correctly. These actions can reduce the amount of plastic that reaches the environment. However, rules alone are not enough. Businesses and individuals also have an important role. For example, companies can design products that use less plastic, and customers can choose reusable bottles or shopping bags. People can also pick up litter in their neighborhoods and separate waste at home. Each action may seem small, but millions of small choices can make a large difference. To protect rivers, oceans, and animals, governments, businesses, and citizens need to work together." --write-media audio/11-target-reading-long.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "I think we should use fewer plastic bags because they can reduce plastic waste." --write-media audio/13-fewer-bags.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "I think we should use a reusable bottle because it can reduce plastic waste." --write-media audio/13-reusable-bottle.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "I think we should pick up litter because it can protect the environment." --write-media audio/13-pick-up-litter.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Plastic waste can cause environmental problems, so people are trying to reduce it." --write-media audio/14-summary.mp3
          # Oral Introduction: 4 visual steps
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "People use plastic every day." --write-media audio/oral-01.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Some plastic goes into rivers and reaches the ocean." --write-media audio/oral-02.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Sea animals can be hurt by plastic waste." --write-media audio/oral-03.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Governments, businesses, and people can work together to reduce the problem." --write-media audio/oral-04.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Plastic is convenient. People use it every day." --write-media audio/oral-v2-01.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Some plastic becomes waste and is not collected properly." --write-media audio/oral-v2-02.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "It eventually reaches rivers and the ocean." --write-media audio/oral-v2-03.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Animals may mistake plastic for food. It can harm them." --write-media audio/oral-v2-04.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Governments and citizens can reduce waste by using reusable items and separating trash." --write-media audio/oral-v2-05.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "convenient" --write-media audio/vocab-convenient.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "waste" --write-media audio/vocab-waste.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "properly" --write-media audio/vocab-properly.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "eventually" --write-media audio/vocab-eventually.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "mistake A for B" --write-media audio/vocab-mistake.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "harm" --write-media audio/vocab-harm.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "reduce" --write-media audio/vocab-reduce.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "reusable" --write-media audio/vocab-reusable.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "separate" --write-media audio/vocab-separate.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "citizen" --write-media audio/vocab-citizen.mp3

          # Full reading: one fixed MP3 per sentence so the page can highlight the sentence being read
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Plastic waste is a serious problem in many cities around the world." --write-media audio/read-01.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "People use plastic bags, bottles, and food containers every day because they are light, cheap, and convenient." --write-media audio/read-02.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "However, some of these items are used only once and then thrown away." --write-media audio/read-03.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "When plastic is not collected properly, it can enter rivers and eventually reach the ocean." --write-media audio/read-04.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Sea animals may mistake small pieces of plastic for food, and this can harm them." --write-media audio/read-05.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Many governments are trying to reduce this problem." --write-media audio/read-06.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Some cities charge people for plastic bags, while others ask stores to use paper or reusable materials." --write-media audio/read-07.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Governments can also improve waste collection systems and teach people how to recycle correctly." --write-media audio/read-08.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "However, rules alone are not enough." --write-media audio/read-09.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "Businesses can design products that use less plastic, and customers can choose reusable bottles or shopping bags." --write-media audio/read-10.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "People can also pick up litter in their neighborhoods and separate waste at home." --write-media audio/read-11.mp3
          edge-tts --voice en-US-JennyNeural --rate=-8% --text "To protect rivers, oceans, and animals, governments, businesses, and citizens need to work together." --write-media audio/read-12.mp3


          edge-tts --voice ja-JP-NanamiNeural --rate=-5% --text "今日は、とてもいい天気。" --write-media audio/01-help-ja.mp3
          edge-tts --voice ja-JP-NanamiNeural --rate=-5% --text "見て！" --write-media audio/02-help-ja.mp3
          edge-tts --voice ja-JP-NanamiNeural --rate=-5% --text "川に入ってしまうものもあります。" --write-media audio/04-help-ja.mp3
          edge-tts --voice ja-JP-NanamiNeural --rate=-5% --text "川はごみを海まで運びます。" --write-media audio/05-help-ja.mp3


          # Vocabulary definitions, context sentences, easy examples, and rescue words
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "easy and useful for you" --write-media audio/vocab-convenient-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This bottle is convenient." --write-media audio/vocab-convenient-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Plastic is convenient." --write-media audio/vocab-convenient-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "things that are no longer wanted and are thrown away" --write-media audio/vocab-waste-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This plastic is waste." --write-media audio/vocab-waste-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Some plastic becomes waste." --write-media audio/vocab-waste-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "in the right or correct way" --write-media audio/vocab-properly-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Please close the bottle properly." --write-media audio/vocab-properly-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Plastic is not collected properly." --write-media audio/vocab-properly-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "in the end, after some time" --write-media audio/vocab-eventually-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "The river eventually reaches the sea." --write-media audio/vocab-eventually-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "It eventually reaches the ocean." --write-media audio/vocab-eventually-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to wrongly think that A is B" --write-media audio/vocab-mistake-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "A bird may mistake plastic for food." --write-media audio/vocab-mistake-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Animals may mistake plastic for food." --write-media audio/vocab-mistake-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to hurt or damage someone or something" --write-media audio/vocab-harm-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Smoke can harm animals." --write-media audio/vocab-harm-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Plastic can harm sea animals." --write-media audio/vocab-harm-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to make something smaller or less" --write-media audio/vocab-reduce-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We can reduce waste." --write-media audio/vocab-reduce-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We need to reduce plastic waste." --write-media audio/vocab-reduce-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "able to be used again" --write-media audio/vocab-reusable-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This bottle is reusable." --write-media audio/vocab-reusable-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "People can choose reusable bags." --write-media audio/vocab-reusable-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to divide things into different groups" --write-media audio/vocab-separate-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We separate paper and plastic." --write-media audio/vocab-separate-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "People separate waste at home." --write-media audio/vocab-separate-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "a person who belongs to a country or community" --write-media audio/vocab-citizen-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "A citizen can help the city." --write-media audio/vocab-citizen-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Citizens also need to act." --write-media audio/vocab-citizen-context.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "serious" --write-media audio/help-serious.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "bad or important enough to need attention" --write-media audio/help-serious-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This is a serious problem." --write-media audio/help-serious-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "container" --write-media audio/help-container.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "something used to hold things" --write-media audio/help-container-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Food is in a container." --write-media audio/help-container-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "cheap" --write-media audio/help-cheap.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "not costing much money" --write-media audio/help-cheap-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This bag is cheap." --write-media audio/help-cheap-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "throw away" --write-media audio/help-throw-away.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to get rid of something you do not want" --write-media audio/help-throw-away-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Do not throw away this bottle." --write-media audio/help-throw-away-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "collect" --write-media audio/help-collect.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to bring things together" --write-media audio/help-collect-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We collect plastic bottles." --write-media audio/help-collect-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "reach" --write-media audio/help-reach.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to arrive at a place" --write-media audio/help-reach-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "The river reaches the ocean." --write-media audio/help-reach-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "ocean" --write-media audio/help-ocean.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "a very large area of salt water" --write-media audio/help-ocean-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Plastic can reach the ocean." --write-media audio/help-ocean-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "piece" --write-media audio/help-piece.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "a small part of something" --write-media audio/help-piece-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "I found a small piece of plastic." --write-media audio/help-piece-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "government" --write-media audio/help-government.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "the group that makes rules for a country or area" --write-media audio/help-government-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "The government makes rules." --write-media audio/help-government-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "charge" --write-media audio/help-charge.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to ask someone to pay money" --write-media audio/help-charge-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Some stores charge for bags." --write-media audio/help-charge-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "material" --write-media audio/help-material.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "what something is made from" --write-media audio/help-material-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Paper is a useful material." --write-media audio/help-material-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "improve" --write-media audio/help-improve.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to make something better" --write-media audio/help-improve-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We can improve this system." --write-media audio/help-improve-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "waste collection" --write-media audio/help-waste-collection.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "the work of collecting waste" --write-media audio/help-waste-collection-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Waste collection keeps streets clean." --write-media audio/help-waste-collection-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "recycle" --write-media audio/help-recycle.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to use old things again to make new things" --write-media audio/help-recycle-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We recycle plastic bottles." --write-media audio/help-recycle-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "rule" --write-media audio/help-rule.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "something people must or should follow" --write-media audio/help-rule-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Our school has rules." --write-media audio/help-rule-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "enough" --write-media audio/help-enough.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "as much as you need" --write-media audio/help-enough-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "One rule is not enough." --write-media audio/help-enough-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "business" --write-media audio/help-business.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "a company or work that sells things or services" --write-media audio/help-business-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Businesses can use less plastic." --write-media audio/help-business-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "product" --write-media audio/help-product.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "something that a company makes or sells" --write-media audio/help-product-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "This product uses less plastic." --write-media audio/help-product-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "customer" --write-media audio/help-customer.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "a person who buys something" --write-media audio/help-customer-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "Customers can choose reusable bags." --write-media audio/help-customer-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "choose" --write-media audio/help-choose.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to decide which thing you want" --write-media audio/help-choose-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "I choose a reusable bottle." --write-media audio/help-choose-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "litter" --write-media audio/help-litter.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "waste left on the ground in a public place" --write-media audio/help-litter-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We pick up litter." --write-media audio/help-litter-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "neighborhood" --write-media audio/help-neighborhood.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "the area near where you live" --write-media audio/help-neighborhood-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "I clean my neighborhood." --write-media audio/help-neighborhood-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "protect" --write-media audio/help-protect.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to keep someone or something safe" --write-media audio/help-protect-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We want to protect animals." --write-media audio/help-protect-example.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "work together" --write-media audio/help-work-together.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "to do something with other people" --write-media audio/help-work-together-def.mp3
          edge-tts --voice en-US-JennyNeural --rate=-10% --text "We can work together." --write-media audio/help-work-together-example.mp3

      - name: Commit audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Add fixed WORLD BRIDGE lesson audio"
          git pull --rebase origin main
          git push
