<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD BRIDGE — WORLD 01</title>
<style>
:root{--deep:#102A43;--ocean:#167D9A;--sky:#DDF3F5;--sand:#F4E9D5;--coral:#FF7A66;--ink:#17212B;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#eef5f5;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 30px #102a4315}.top{padding:15px 18px 10px;position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(10px);z-index:5}.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--deep)}.back{border:0;background:var(--sky);border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--deep)}.progress{height:6px;background:#e5eeee;border-radius:8px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ocean);transition:width .25s}.screen{padding:0 18px 28px;min-height:calc(100vh - 82px);display:flex;flex-direction:column}.visual{height:auto;min-height:0;max-height:none;margin:0 -18px 20px;background:#f4f8f8;overflow:visible;display:flex;justify-content:center}.visual img{width:100%;height:auto;max-height:none;display:block;object-fit:contain}.card{background:#fff;border-radius:25px;padding:2px 4px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ocean);font-weight:800;margin:8px 0}.title{font-size:clamp(27px,7vw,38px);line-height:1.12;margin:0 0 11px;color:var(--deep)}.jp{font-size:15px;line-height:1.75;margin:0 0 15px;color:#53636b}.english{font-size:22px;line-height:1.35;font-weight:800;color:var(--deep);background:#e5f6f7;border-radius:18px;padding:18px;margin:12px 0}.helper{background:#fff8ee;border:1px solid #f1dfc6;border-radius:15px;padding:11px 13px;margin:13px 0;font-size:14px;color:#56636a}.helper summary{cursor:pointer;color:#916b42;font-weight:700}.listen{width:100%;border:0;background:#d9f3f5;color:#05617a;border-radius:20px;padding:13px;font-size:16px;font-weight:800;margin:7px 0 12px}.choices{display:grid;gap:9px;margin:10px 0 15px}.choice{border:2px solid #e6eeee;background:#f7fbfb;color:var(--deep);border-radius:16px;padding:13px 12px;font-size:16px;font-weight:700;cursor:pointer}.choice.selected{border-color:var(--ocean);background:#dff5f6}.choice.correct{border-color:#72b99f;background:#e5f6ee}.choice.wrong{border-color:#f2c4a8;background:#fff1ea}.bottom{margin-top:auto;display:flex;gap:9px}.nav{flex:1;border:0;border-radius:18px;padding:15px;background:var(--ocean);color:#fff;font-size:17px;font-weight:800;cursor:pointer}.nav.secondary{background:var(--sky);color:var(--deep)}.nav:disabled{opacity:.45}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tag{background:var(--sky);color:var(--deep);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}.input{width:100%;border:2px solid #d6e7e8;border-radius:15px;padding:13px;font-size:16px;margin:5px 0 12px;color:var(--ink);background:#fbfefe}.small{font-size:12px;color:#6a7b82;font-weight:700}.complete{background:linear-gradient(#fff,#effafa);text-align:center}.complete .visual{height:auto}.complete .title{font-size:32px}.center{align-items:center;justify-content:center;text-align:center}.logo{letter-spacing:.25em;font-size:14px;font-weight:900;color:var(--ocean)}
</style></head><body><main class="app" id="app"></main>
<script>
const A='';
const screens=[
 {label:'Entry',img:'hero.png',ey:'WORLD 01',title:'Where Does<br>Our Plastic Go?',jp:'すてたプラスチックは、どこへ行く？',listen:'Where does our plastic go?',help:'今日は、とてもいい天気。',start:true},
 {label:'Discover',img:'hero.png',ey:'DISCOVER',title:'Something is flying...<br>Look!',jp:'何かが飛んでいます。見てみよう。',listen:'Something is flying. Look!',help:'見て！'},
 {label:'Prediction',img:'hero.png',ey:'WHAT DO YOU THINK?',title:'Where will it go?',jp:'どこへ行くと思う？',choices:['川へ','海へ','どこかで消える']},
 {label:'Story — River',img:'story.png',ey:'FOLLOW THE PLASTIC',title:'Some plastic goes<br>into rivers.',jp:'プラスチックごみの中には、川に入ってしまうものもあります。',listen:'Some plastic goes into rivers.',help:'川に入ってしまうものもあります。'},
 {label:'Story — Ocean',img:'story.png',ey:'FOLLOW THE WATER',title:'Rivers carry it<br>to the ocean.',jp:'川はそれを海まで運んでいきます。',listen:'Rivers carry it to the ocean.',help:'川はごみを海まで運びます。'},
 {label:'Story — Animals',img:'environment.png',ey:'WHY?',title:'This can be a problem<br>for animals.',jp:'これは動物たちにとって問題です。',choices:['食べ物だと思うかもしれない','眠くなるから','わからない']},
 {label:'plastic waste',img:'story.png',ey:'NEW IDEA',title:'plastic waste',jp:'使い終わって捨てられたプラスチックなどのこと。',english:'plastic + waste',listen:'plastic waste'},
 {label:'environment',img:'environment.png',ey:'LOOK AT THE WHOLE WORLD',title:'environment',jp:'人や動物、植物、水、空気、町など、私たちを取りまく世界。',choices:['海だけ','森だけ','みんなを取りまく世界全部']},
 {label:'Same Idea. New English.',ey:'SAME IDEA. NEW ENGLISH.',title:'Same idea.<br>New English.',jp:'同じ意味でも、英語がレベルアップします。',english:'People use a lot of plastic.<br>↓<br>People produce a lot of plastic waste.',listen:'People produce a lot of plastic waste.'},
 {label:'government',img:'government.png',ey:'WHO CAN HELP?',title:'government',jp:'みんなが暮らす社会のために、ルールを作ったり公共の仕事をしたりするしくみ。',tags:['roads','schools','parks','waste collection','public transport','rules']},
 {label:'Target Reading',img:'environment.png',ey:'TARGET READING',title:'Now read the whole idea.',jp:'まとまった英文を読んでみよう。',english:'Plastic waste can cause problems for sea animals.',listen:'Plastic waste can cause problems for sea animals.'},
 {label:'reduce Transfer',img:'environment.png',ey:'USE IT SOMEWHERE NEW',title:'We should _____<br>food waste.',choices:['reduce','protect','reach']},
 {label:'Your Idea',img:'hero.png',ey:'YOUR IDEA',title:'What can we do<br>to reduce plastic waste?',jp:'自分の考えを英文にしてみよう。',input:true},
 {label:'Summary',img:'environment.png',ey:'ONE-SENTENCE SUMMARY',title:'Which sentence tells<br>the main idea?',choices:['Plastic waste can cause environmental problems, so people are trying to reduce it.','Plastic waste always disappears in rivers.','Sea animals produce plastic waste.'],listen:'Plastic waste can cause environmental problems, so people are trying to reduce it.'},
 {label:'WORLD 01 COMPLETE',img:'complete.png',ey:'WORLD 01 COMPLETE',title:'You can read<br>this world now.',jp:'知らなかった世界が、英語で読める世界になった。',tags:['plastic waste','environment','reduce','protect','government'],complete:true}
];
let page=0,chosen=null,utter=null; const app=document.getElementById('app');
if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices()}
function stop(){if('speechSynthesis' in window){window.speechSynthesis.cancel()} utter=null}
function pickVoice(lang){if(!('speechSynthesis' in window))return null;const vs=window.speechSynthesis.getVoices()||[];const want=(lang||'').toLowerCase();const base=want.split('-')[0];if(base==='en'){const enUS=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en-us'));const preferred=['Samantha','Ava','Allison','Susan','Zoe','Tom'];for(const name of preferred){const hit=enUS.find(v=>v.name&&v.name.toLowerCase().includes(name.toLowerCase()));if(hit)return hit}if(enUS.length)return enUS[0]}return vs.find(v=>v.lang&&v.lang.toLowerCase()===want)||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(base))||null}
function speak(text,lang='en-US'){if(!text)return;if(!('speechSynthesis' in window)){alert('このブラウザでは音声読み上げを利用できません。Chrome または Safari で開いてください。');return}const synth=window.speechSynthesis;synth.cancel();utter=new SpeechSynthesisUtterance(text);utter.lang=lang;utter.rate=0.82;utter.pitch=1;utter.volume=1;const v=pickVoice(lang);if(v)utter.voice=v;synth.resume();synth.speak(utter)}
function speakCurrent(){const s=screens[page];speak(s.listen||s.english||'','en-US')}
function speakHelp(){const s=screens[page];speak(s.help||'','ja-JP')}
function render(){stop();chosen=null;const s=screens[page], pct=(page+1)/15*100;app.innerHTML=`<header class="top"><div class="topline"><button class="back" onclick="go(-1)" ${page===0?'disabled':''}>‹</button><span>WORLD BRIDGE</span><span>${page+1}/15</span></div><div class="progress"><i style="width:${pct}%"></i></div></header><section class="screen ${s.complete?'complete':''} ${page===0?'center':''}">${s.img?`<div class="visual"><img src="${s.img}" alt=""></div>`:''}<div class="card"><div class="eyebrow">${s.ey}</div><h1 class="title">${s.title}</h1>${s.jp?`<p class="jp">${s.jp}</p>`:''}${s.english?`<div class="english">${s.english}</div>`:''}${s.tags?`<div class="tags">${s.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}${s.choices?`<div class="choices">${s.choices.map((x,i)=>`<button class="choice" data-i="${i}" onclick="choose(this,${i})">${x}</button>`).join('')}</div>`:''}${s.input?`<div class="small">STEP 1　行動を選ぶ</div><select class="input" id="act"><option>use fewer plastic bags</option><option>use a reusable bottle</option><option>pick up litter</option></select><div class="small">STEP 2　英文を作る</div><div class="english" id="idea">I think we should use fewer plastic bags because they create plastic waste.</div><button class="listen" onclick="speak(document.getElementById('idea').innerText)">🔊 Listen</button>`:''}${s.listen?`<button class="listen" onclick="speakCurrent()">🔊 Listen</button>`:''}${s.help?`<details class="helper"><summary>▱ 日本語HELP</summary><div>${s.help}</div><button class="listen" onclick="speakHelp()">🔊 日本語を聞く</button></details>`:''}</div><div class="bottom">${page>0?'<button class="nav secondary" onclick="go(-1)">戻る</button>':''}${page===0?'<button class="nav" onclick="go(1)">はじめる →</button>':page===14?'<button class="nav" onclick="page=0;render()">もう一度見る</button>':'<button class="nav" onclick="go(1)">次へ →</button>'}</div></section>`}
function choose(el,i){chosen=i;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected','correct','wrong'));el.classList.add('selected');const correct={2:0,5:0,7:2,11:0,13:0}[page]; if(correct===i)el.classList.add('correct'); else if(correct!==undefined)el.classList.add('wrong')}
function go(n){page=Math.max(0,Math.min(14,page+n));render();window.scrollTo(0,0)}
render();
</script></body></html>
